# iOS build for storytold/photocraft — unsigned .ipa with an embedded Chinese UI font.
#
# The runner clones the upstream source itself (fast, unrestricted network), so
# this repository only carries the build inputs: the patch script, the craft-fonts
# tree (Noto Sans SC subset) and the build harness.
#
# Nothing here is signed: codesigning needs an Apple Developer identity which this
# workflow deliberately does not have. The .ipa is meant for a self-signing /
# sideloading flow on the user's own device.
#
# Two jobs:
#   build   - macOS runner, cross-compiles aarch64-apple-ios, assembles the .ipa
#   publish - copies the .ipa onto a release (release asset URLs are fetchable
#             by anyone for a public repo; artifact downloads need a login)

name: ios-build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    defaults:
      run:
        working-directory: src

    steps:
      # This repository carries patch-ios.py + craft-fonts/; upstream is cloned below.
      - name: Checkout this repo (build inputs)
        uses: actions/checkout@v4
        with:
          path: probe

      - name: Clone upstream source
        working-directory: .
        run: |
          git clone --depth 1 https://github.com/storytold/photocraft.git src
          cd src && git log --oneline -1

      - name: Add iOS target
        run: rustup target add aarch64-apple-ios

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: ios

      # ---------------------------------------------------------------- patch
      # Desktop-only dependencies (no iOS impl at all): rfd, arboard, open,
      # photocraft-tablet. See patch-ios.py for the full rationale.
      - name: Apply the iOS patch
        run: python3 ../probe/patch-ios.py

      # ------------------------------------------------------- embedded fonts
      # craft-fonts is the upstream-blessed channel for build-time embedded CJK
      # fonts (crates/text/build.rs reads CRAFT_FONTS_DIR/fonts/manifest.txt and
      # include_bytes!()s each entry). Upstream ships it for Japanese only, so
      # patch-fonts.py widens the selection to Hans/Hant. The font itself lives
      # in this repo (probe/craft-fonts): a 473 KB Noto Sans SC subset covering
      # the UI strings in crates/ui-egui/src/i18n/zh-hans.tsv.
      - name: Apply the Chinese-font patch
        run: python3 ../probe/patch-fonts.py

      - name: Show the embedded font
        working-directory: .
        run: |
          echo "--- manifest ---"
          cat probe/craft-fonts/fonts/manifest.txt
          echo "--- sizes ---"
          ls -l probe/craft-fonts/fonts/
          du -sh probe/craft-fonts

      # ----------------------------------------------------------------- build
      # CRAFT_FONTS_DIR is absolute: build scripts run in the crate folder, so a
      # relative path would resolve from crates/text. CRAFT_FONTS_REQUIRED makes
      # a bad path a hard error instead of a silent Latin-only build.
      - name: Build the app for aarch64-apple-ios
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/probe/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: |
          cargo build --release --target aarch64-apple-ios -p photocraft 2>&1 | tee build.log
          echo "--- binary ---"
          ls -l target/aarch64-apple-ios/release/photocraft
          file target/aarch64-apple-ios/release/photocraft

      # ------------------------------------------------------------ sanity gate
      # The whole point of this build is the Chinese font. Fail loudly if the
      # embedded byte range did not survive into the final Mach-O, rather than
      # shipping another tofu .ipa.
      - name: Verify the font really is inside the binary
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/probe/craft-fonts
        run: |
          BIN=target/aarch64-apple-ios/release/photocraft
          {
            echo "# iOS build - storytold/photocraft"
            echo
            echo "## Environment"
            echo "- runner arch : $(uname -m)"
            echo "- macOS       : $(sw_vers -productVersion)"
            echo "- rustc       : $(rustc --version)"
            echo
            echo "## Binary"
            echo '```'
            ls -l "$BIN"
            file "$BIN"
            echo '```'
            echo
            echo "## Embedded font check"
            echo '```'
          } > probe-out.md

          FONT="$CRAFT_FONTS_DIR/fonts/NotoSansSC-UI-Subset.ttf"
          HITS=$(strings -a "$BIN" | grep -c 'Noto Sans SC' || true)
          echo "font file          : $FONT" >> probe-out.md
          echo "font bytes         : $(stat -f%z "$FONT")" >> probe-out.md
          echo "'Noto Sans SC' hits: $HITS" >> probe-out.md
          # The family name sits in the generated CraftFont {...} initialiser,
          # which is a string literal in the binary.
          if [ "$HITS" -lt 1 ]; then
            echo "RESULT: FAIL - the font did not make it into the binary" >> probe-out.md
            echo '```' >> probe-out.md
            cat probe-out.md
            exit 1
          fi
          echo "RESULT: PASS" >> probe-out.md
          echo '```' >> probe-out.md
          cat probe-out.md

      # ------------------------------------------------------------- bundle
      # ------------------------------------------------------------- bundle
      # The first build shipped only the executable and a bare Info.plist, so iOS
      # had no icon to show and drew the blank default tile. Icons need three
      # things: the PNGs in the bundle root, a CFBundleIcons block naming them,
      # and no alpha channel / no pre-rounded corners (iOS applies its own mask).
      # _mkicons.py made the renders, _mkplist.py writes the plist, and
      # _bundleipa.py assembles the .ipa and cross-checks that every name the
      # plist declares actually exists in the bundle.
      - name: Assemble the unsigned .ipa (with the app icon)
        env:
          ICON_DIR: ${{ github.workspace }}/probe/icons
        run: |
          BIN=target/aarch64-apple-ios/release/photocraft
          python3 ../probe/_bundleipa.py "$BIN" "$ICON_DIR" PhotoCraft-unsigned.ipa 0.5.0 2>&1 | tee bundle.log
          {
            echo
            echo "## .ipa"
            echo '```'
            ls -l PhotoCraft-unsigned.ipa
            unzip -l PhotoCraft-unsigned.ipa
            echo '```'
            echo
            echo "UNSIGNED - needs a self-signing / sideloading flow to install."
          } >> probe-out.md

      - name: Upload the build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photocraft-ios
          path: |
            src/probe-out.md
            src/PhotoCraft-unsigned.ipa
            src/build.log
            src/bundle.log
          if-no-files-found: ignore

  # Artifact downloads require a signed-in session; release assets do not, so the
  # same files are copied onto a release for easy pickup.
  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download the build artifact
        uses: actions/download-artifact@v4
        with:
          name: photocraft-ios
          path: out

      - name: Publish them as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh out
          # Only publish something worth downloading; a failed build leaves the
          # report but no .ipa, and an empty release would just be confusing.
          if ! ls out/*.ipa >/dev/null 2>&1; then
            echo "No .ipa in the artifact - the build did not get that far. Nothing published."
            ls -l out
            exit 0
          fi
          TAG="ios-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "PhotoCraft iOS #${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned PhotoCraft for iOS (arm64) with an embedded Noto Sans SC subset, so the Chinese UI renders instead of tofu boxes. Self-sign / sideload it - nothing here is signed." \
            --latest \
            $(find out -type f -printf '%p ') || \
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $(find out -type f -printf '%p ')
